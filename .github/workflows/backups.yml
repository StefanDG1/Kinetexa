name: Private backups
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-backups
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Snapshot database and retain private objects
        run: node scripts/backup.mjs
        env:
          BACKUP_CONFIG: ${{ matrix.environment == 'staging' && secrets.KINETEXA_BACKUP_STAGING || secrets.KINETEXA_BACKUP_PRODUCTION }}
      - name: Enforce retention even if snapshot creation failed
        if: always()
        run: node scripts/backup.mjs --prune-only
        env:
          BACKUP_CONFIG: ${{ matrix.environment == 'staging' && secrets.KINETEXA_BACKUP_STAGING || secrets.KINETEXA_BACKUP_PRODUCTION }}
