name: Operational checks
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operational-checks
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check queues, failures and operating costs
        run: node scripts/monitor.mjs
        env:
          OPS_CONFIG: ${{ matrix.environment == 'staging' && secrets.KINETEXA_OPS_STAGING || secrets.KINETEXA_OPS_PRODUCTION }}
